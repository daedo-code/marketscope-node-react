services:
  mysql:
    image: mysql:8.4
    container_name: intelligence-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: market_intelligence
      MYSQL_USER: market_user
      MYSQL_PASSWORD: market_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3313:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ./server
    container_name: intelligence-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: market_intelligence
      DB_USER: market_user
      DB_PASSWORD: market_password
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    profiles: ["app"]
    build:
      context: ./client
    container_name: intelligence-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mysql_data:
